# Local services for development: PostgreSQL (all data) and Redis (job queue + real-time pub/sub).
# Start: npm run db:up    Stop: npm run db:down
services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: autoplan
      POSTGRES_PASSWORD: autoplan_dev
      POSTGRES_DB: autoplan
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U autoplan']
      interval: 5s
      retries: 10

  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      - '6379:6379'

volumes:
  pgdata:
